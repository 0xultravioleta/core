name: repro-aarch64-wheels

on:
  push:
    branches: [repro/aarch64-wheels]

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        ref: [refs/heads/main, refs/pull/250/head]
        variant: [baseline, cflags, manylinux_2_28]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: open-wallet-standard/core
          ref: ${{ matrix.ref }}


      - name: Build (baseline, as release.yml)
        if: matrix.variant == 'baseline'
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad
        with:
          target: aarch64-unknown-linux-gnu
          args: --release --out dist -i python3.9 python3.13
          manylinux: auto
          working-directory: bindings/python

      - name: Build (CFLAGS __ARM_ARCH)
        if: matrix.variant == 'cflags'
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad
        env:
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          target: aarch64-unknown-linux-gnu
          args: --release --out dist -i python3.9 python3.13
          manylinux: auto
          working-directory: bindings/python

      - name: Build (manylinux 2_28)
        if: matrix.variant == 'manylinux_2_28'
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad
        with:
          target: aarch64-unknown-linux-gnu
          args: --release --out dist -i python3.9 python3.13
          manylinux: 2_28
          working-directory: bindings/python

      - name: Inspect wheels
        run: |
          ls -la bindings/python/dist
          pip install auditwheel
          for w in bindings/python/dist/*.whl; do auditwheel show "$w"; done
