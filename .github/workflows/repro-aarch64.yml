name: repro-aarch64-wheels

on:
  push:
    branches: [repro/aarch64-wheels]

permissions:
  contents: read

jobs:
  python-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: refs/heads/main
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - ref: refs/heads/main
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - ref: refs/heads/main
            target: x86_64-apple-darwin
            os: macos-latest
          - ref: refs/heads/main
            target: aarch64-apple-darwin
            os: macos-latest
          - ref: refs/pull/250/head
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - ref: refs/pull/250/head
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - ref: refs/pull/250/head
            target: x86_64-apple-darwin
            os: macos-latest
          - ref: refs/pull/250/head
            target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: open-wallet-standard/core
          ref: ${{ matrix.ref }}
      - run: git -C "$GITHUB_WORKSPACE" log -1 --oneline

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: runner.os == 'macOS'
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13

      - name: Set version from tag
        run: |
          V="1.4.3"
          "$GITHUB_WORKSPACE/scripts/set-version.sh" "$V" --python

      - name: Build wheels
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.9 python3.10 python3.11 python3.12 python3.13
          sccache: "true"
          manylinux: auto
          working-directory: bindings/python

      - name: Upload wheels
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: python-wheel-${{ matrix.target }}-${{ strategy.job-index }}
          path: bindings/python/dist/*.whl

