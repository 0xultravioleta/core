name: repro-npm-wait

on:
  push:
    branches: [repro/npm-wait]

permissions:
  contents: read

jobs:
  wait:
    strategy:
      fail-fast: false
      matrix:
        ref_name: [v1.4.3, v9.9.9]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Wait for the core package on the registry
        env:
          TAG: ${{ matrix.ref_name }}
        run: |
          V="${TAG#v}"
          for _ in $(seq 1 3); do
            npm view "@open-wallet-standard/core@$V" version && exit 0
            sleep 10
          done
          echo "@open-wallet-standard/core@$V is not on the registry after 5 minutes"
          exit 1
